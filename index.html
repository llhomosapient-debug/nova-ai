<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #252936;
      background: #141720;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      margin-left: 10px;
      font-size: 12px;
      color: #8f96a8;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px 15%;
    }

    .message {
      margin-bottom: 20px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user {
      text-align: right;
    }

    .bubble {
      display: inline-block;
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      background: #202532;
      text-align: left;
    }

    .user .bubble {
      background: #303747;
    }

    .nova .bubble {
      background: transparent;
    }

    .input-area {
      padding: 15px;
      border-top: 1px solid #252936;
      background: #141720;
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      gap: 10px;
      background: #202532;
      border: 1px solid #303747;
      border-radius: 16px;
      padding: 8px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 10px;
      font-size: 15px;
      min-height: 42px;
      max-height: 150px;
    }

    button {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      cursor: pointer;
      font-size: 18px;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .typing {
      color: #8f96a8;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      #chat {
        padding: 20px 12px;
      }

      .bubble {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">Nova AI</div>
    <div class="status">Online</div>
  </header>

  <main id="chat"></main>

  <div class="input-area">
    <div class="input-box">

      <textarea
        id="message"
        placeholder="Message Nova..."
        rows="1"
      ></textarea>

      <button id="send" onclick="sendMessage()">↑</button>

    </div>
  </div>

</div>

<script>
  const input = document.getElementById("message");
  const chat = document.getElementById("chat");
  const sendButton = document.getElementById("send");

  input.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }

  });

  async function sendMessage() {

    const message = input.value.trim();

    if (!message) return;

    addMessage("user", message);

    input.value = "";
    sendButton.disabled = true;

    const typing = document.createElement("div");
    typing.className = "message nova";
    typing.innerHTML = '<div class="typing">Nova is thinking...</div>';

    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    try {

      const response = await fetch(
        "https://muddy-tooth-d17c.llhomosapient.workers.dev",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        }
      );

      const data = await response.json();

      typing.remove();

      if (data.error) {
        addMessage("nova", "Something went wrong: " + data.error);
      } else {
        addMessage("nova", data.response);
      }

    } catch (error) {

      typing.remove();

      addMessage(
        "nova",
        "I couldn't connect to the Nova server."
      );

    }

    sendButton.disabled = false;
    input.focus();
  }

  function addMessage(type, text) {

    const message = document.createElement("div");
    message.className = "message " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
  }
</script>

</body>
</html>
