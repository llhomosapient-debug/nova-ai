<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nova AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0b0b0f;
      --sidebar: #111116;
      --panel: #17171d;
      --panel2: #1d1d24;
      --border: #292931;
      --text: #f5f5f7;
      --muted: #92929d;
      --accent: #ffffff;
      --bubble: #24242c;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px;
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: linear-gradient(135deg, #fff, #777);
      color: #000;
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .brand-name {
      font-weight: 700;
      font-size: 16px;
    }

    .new-chat {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 14px;
      cursor: pointer;
      text-align: left;
    }

    .new-chat:hover {
      background: var(--panel2);
    }

    .section-title {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 8px 10px 2px;
    }

    .chat-item {
      padding: 10px;
      border-radius: 9px;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item:hover {
      background: var(--panel);
      color: var(--text);
    }

    .sidebar-bottom {
      margin-top: auto;
    }

    .settings {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 11px;
      border-radius: 9px;
      text-align: left;
      cursor: pointer;
    }

    .settings:hover {
      background: var(--panel);
      color: var(--text);
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 10px;
    }

    .model {
      font-weight: 650;
    }

    .status {
      color: #72d58b;
      font-size: 12px;
      margin-left: 5px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 40px 20px 160px;
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 760px;
      margin: 12vh auto 0;
      text-align: center;
    }

    .welcome-logo {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      margin: auto;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #fff, #666);
      color: #000;
      font-size: 23px;
      font-weight: 850;
    }

    .welcome h1 {
      font-size: 32px;
      margin: 20px 0 8px;
    }

    .welcome p {
      color: var(--muted);
      margin: 0;
    }

    .message {
      max-width: 820px;
      margin: 0 auto 28px;
      display: flex;
      gap: 13px;
      line-height: 1.65;
    }

    .avatar {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      background: var(--panel2);
    }

    .message.user .avatar {
      background: #303039;
    }

    .content {
      min-width: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .composer-wrap {
      position: fixed;
      bottom: 0;
      left: 260px;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, var(--bg) 35%);
    }

    .composer {
      max-width: 820px;
      margin: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px 12px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }

    textarea {
      flex: 1;
      resize: none;
      max-height: 180px;
      min-height: 28px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 8px 4px;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: #777783;
    }

    .send {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 11px;
      background: var(--accent);
      color: #000;
      cursor: pointer;
      font-weight: 800;
    }

    .send:hover {
      opacity: .85;
    }

    .send:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .composer-wrap {
        left: 0;
      }

      .messages {
        padding-top: 25px;
      }

      .welcome h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="brand">
      <div class="logo">N</div>
      <div class="brand-name">Nova</div>
    </div>

    <button class="new-chat" onclick="newChat()">
      + New chat
    </button>

    <div class="section-title">Recent</div>

    <div id="chatHistory"></div>

    <div class="sidebar-bottom">
      <button class="settings" onclick="alert('Settings coming soon')">
        ⚙ Settings
      </button>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">
      <div class="model">Nova</div>
      <div class="status">● Online</div>
    </header>

    <section class="messages" id="messages">

      <div class="welcome" id="welcome">
        <div class="welcome-logo">N</div>
        <h1>How can I help?</h1>
        <p>Ask Nova anything</p>
      </div>

    </section>

    <div class="composer-wrap">

      <div class="composer">

        <textarea
          id="input"
          rows="1"
          placeholder="Message Nova..."
        ></textarea>

        <button
          class="send"
          id="send"
          onclick="sendMessage()"
        >
          ↑
        </button>

      </div>

    </div>

  </main>

</div>

<script>

const API_URL =
  "https://muddy-tooth-d17c.llhomosapient.workers.dev";

const input = document.getElementById("input");
const send = document.getElementById("send");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const chatHistory = document.getElementById("chatHistory");

let conversation = [];

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
});

input.addEventListener("keydown", event => {

  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }

});

function addMessage(role, text) {

  welcome.style.display = "none";

  const message = document.createElement("div");
  message.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "U" : "N";

  const content = document.createElement("div");
  content.className = "content";
  content.textContent = text;

  message.appendChild(avatar);
  message.appendChild(content);

  messages.appendChild(message);

  messages.scrollTop = messages.scrollHeight;

  return content;
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text || send.disabled) return;

  input.value = "";
  input.style.height = "auto";

  addMessage("user", text);

  conversation.push({
    role: "user",
    content: text
  });

  send.disabled = true;

  const novaMessage = addMessage("assistant", "Thinking...");

  try {

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed");
    }

    novaMessage.textContent =
      data.response || "I'm here";

    conversation.push({
      role: "assistant",
      content: novaMessage.textContent
    });

    saveChat(text);

  } catch (error) {

    novaMessage.textContent =
      "Nova couldn't connect right now";

    console.error(error);

  } finally {

    send.disabled = false;
    input.focus();

  }
}

function newChat() {

  conversation = [];

  messages.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="welcome-logo">N</div>
      <h1>How can I help?</h1>
      <p>Ask Nova anything</p>
    </div>
  `;

  input.focus();
}

function saveChat(text) {

  const item = document.createElement("div");

  item.className = "chat-item";
  item.textContent =
    text.length > 30
      ? text.slice(0, 30) + "..."
      : text;

  chatHistory.prepend(item);

}

input.focus();

</script>

</body>
</html>
