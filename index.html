<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <meta name="color-scheme" content="dark">
  <title>Nova</title>
  <link rel="stylesheet" href="css/app.css?v=6">
  <link rel="stylesheet" href="css/chat.css?v=6">
  <link rel="stylesheet" href="css/settings.css?v=6">
  <style>
    .image-message .message-content { max-width: min(760px, 88vw); padding: 0; overflow: hidden; border-radius: 20px; }
    .image-content img { display:block; width:min(760px,100%); max-height:760px; object-fit:contain; border-radius:20px; box-shadow:0 18px 70px rgba(20,120,255,.18); background:rgba(255,255,255,.035); }
    .nova-auth-backdrop { position:fixed; inset:0; z-index:10000; display:grid; place-items:center; padding:24px; background:rgba(2,8,18,.66); backdrop-filter:blur(22px) saturate(130%); opacity:0; transition:opacity .2s ease; }
    .nova-auth-backdrop.visible { opacity:1; }
    .nova-auth-card { position:relative; width:min(470px,100%); padding:34px; border:1px solid rgba(255,255,255,.14); border-radius:30px; background:linear-gradient(145deg,rgba(20,32,52,.9),rgba(7,14,27,.82)); box-shadow:0 35px 120px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.08); overflow:hidden; }
    .nova-auth-logo { width:54px;height:54px;display:grid;place-items:center;border-radius:17px;color:#06101e;font-weight:900;background:linear-gradient(135deg,#fff,#8cc7ff);box-shadow:0 10px 40px rgba(80,170,255,.3); }
    .nova-auth-eyebrow { margin-top:24px;font-size:11px;letter-spacing:.16em;color:#8ebeff; }
    .nova-auth-card h2 { margin:8px 0 10px;font-size:30px;letter-spacing:-.03em; }
    .nova-auth-card p { color:#9caac0;line-height:1.6;margin:0 0 22px; }
    .nova-auth-form { display:grid;gap:10px; }
    .nova-auth-form input { width:100%;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:13px 14px;outline:none;color:#eef6ff;background:rgba(255,255,255,.055); }
    .nova-auth-form input:focus { border-color:rgba(100,180,255,.55);box-shadow:0 0 0 4px rgba(70,150,255,.1); }
    .nova-auth-primary,.nova-auth-guest { width:100%;border-radius:14px;padding:13px 16px;cursor:pointer;font-weight:700; }
    .nova-auth-primary { border:0;color:#04101d;background:linear-gradient(135deg,#fff,#9dd2ff); }
    .nova-auth-guest { margin-top:10px;border:1px solid rgba(255,255,255,.11);color:#dce9f8;background:rgba(255,255,255,.045); }
    .nova-auth-card small { display:block;margin-top:16px;color:#718096;line-height:1.5; }
    .nova-auth-close { position:absolute;top:15px;right:15px;width:34px;height:34px;border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#aebbd0;background:rgba(255,255,255,.045);cursor:pointer;font-size:19px;line-height:1; }
    .nova-auth-orb { position:absolute;width:260px;height:260px;border-radius:50%;filter:blur(70px);pointer-events:none; }
    .nova-auth-orb-a { background:rgba(35,125,255,.2);top:5%;left:10%; }
    .nova-auth-orb-b { background:rgba(90,210,255,.12);bottom:5%;right:10%; }
  </style>
</head>
<body>
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><div class="ambient ambient-three"></div>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-top">
      <div class="brand"><div class="nova-symbol">N</div><div class="brand-copy"><strong>Nova</strong><span>AI workspace</span></div></div>
      <button id="newChat" class="new-chat" type="button"><span class="new-chat-icon">＋</span><span>New chat</span><kbd>⌘ K</kbd></button>
      <button id="searchChats" class="nav-button" type="button"><span class="nav-icon">⌕</span><span>Search</span><kbd>⌘ F</kbd></button>
    </div>
    <div class="sidebar-scroll">
      <div class="nav-section"><div class="section-label">Workspace</div><button id="projects" class="nav-button" type="button"><span class="nav-icon">◇</span><span>Projects</span></button><button id="library" class="nav-button" type="button"><span class="nav-icon">▱</span><span>Library</span></button><button id="plugins" class="nav-button" type="button"><span class="nav-icon">⌘</span><span>Plugins</span></button></div>
      <div class="nav-section research-section"><div class="section-label">Tools</div><button id="webResearch" class="nav-button" type="button"><span class="nav-icon">◎</span><span>Web research</span></button><button id="imageTools" class="nav-button" type="button"><span class="nav-icon">▧</span><span>Image generation</span></button><button id="labMode" class="nav-button" type="button"><span class="nav-icon">⌘</span><span>Nova Lab</span><span class="nav-badge">LAB</span></button></div>
      <div class="nav-section recent-section"><div class="section-label">Recent</div><div id="chatHistory"></div></div>
    </div>
    <div class="sidebar-bottom"><button id="accountButton" class="profile-button" type="button"><div class="profile-avatar">N</div><div class="profile-copy"><strong>Register</strong><span>Save your Nova workspace</span></div><span class="profile-more">›</span></button><button id="settings" class="settings-link" type="button"><span>⚙</span><span>Settings</span></button></div>
  </aside>
  <main id="main">
    <header id="topbar"><button id="mobileMenu" class="icon-button" type="button" aria-label="Open menu">☰</button><button id="modelSelector" class="model-selector" type="button"><span class="model-status"></span><span>Nova</span><span class="model-arrow">⌄</span></button><div class="topbar-space"></div><button id="shareButton" class="icon-button" type="button" aria-label="Share">↗</button></header>
    <section id="chat"><div id="welcome"><div class="hero-orb"><div class="hero-orb-inner">N</div></div><div class="hero-label">NOVA AI</div><h1>What are we building today?</h1><p>Ask anything. Build anything. Explore anything.</p><div class="suggestions"><button data-prompt="Explain a difficult concept simply" type="button"><span class="suggestion-icon">✦</span><span class="suggestion-copy"><strong>Explain</strong><small>Break down something difficult</small></span><span class="suggestion-arrow">↗</span></button><button data-prompt="Help me write something" type="button"><span class="suggestion-icon">Aa</span><span class="suggestion-copy"><strong>Write</strong><small>Create or improve something</small></span><span class="suggestion-arrow">↗</span></button><button data-prompt="Help me build a project" type="button"><span class="suggestion-icon">&lt;/&gt;</span><span class="suggestion-copy"><strong>Build</strong><small>Code and create projects</small></span><span class="suggestion-arrow">↗</span></button><button data-prompt="Research an interesting topic" type="button"><span class="suggestion-icon">◎</span><span class="suggestion-copy"><strong>Research</strong><small>Search and compare sources</small></span><span class="suggestion-arrow">↗</span></button></div></div><div id="messages"></div></section>
    <footer id="composer-area"><div id="composer"><button id="attach" class="composer-button" type="button" aria-label="Attach file">＋</button><textarea id="messageInput" rows="1" placeholder="Message Nova..." autocomplete="off" spellcheck="true"></textarea><button id="sendButton" class="send-button" type="button" aria-label="Send message">↑</button></div><div id="composer-hint">Nova can make mistakes. Check important information.</div></footer>
  </main>
</div>
<script src="js/history.js?v=6"></script><script src="js/chat.js?v=6"></script><script src="js/app.js?v=6"></script><script src="js/lab.js?v=1"></script><script src="js/auth.js?v=1"></script>
</body>
</html>
