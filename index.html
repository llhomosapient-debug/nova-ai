<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <title>Nova</title>

  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/chat.css">
</head>

<body>
  <div style="
  position:fixed;
  inset:0;
  z-index:999999;
  background:red;
  color:white;
  font-size:50px;
  display:grid;
  place-items:center;
">
  NOVA TEST
</div>

<div id="app">

  <aside id="sidebar">

    <div class="brand">
      <div class="nova-mark">N</div>
      <div class="brand-text">
        <strong>Nova</strong>
        <span>AI workspace</span>
      </div>
    </div>

    <button id="newChat" class="new-chat">
      <span>＋</span>
      <span>New chat</span>
      <kbd>⌘ K</kbd>
    </button>

    <button id="searchChats" class="sidebar-action">
      <span class="icon">⌕</span>
      <span>Search</span>
      <kbd>⌘ F</kbd>
    </button>

    <div class="sidebar-scroll">

      <div class="sidebar-label">Workspace</div>

      <button id="projects" class="sidebar-action">
        <span class="icon">◇</span>
        <span>Projects</span>
      </button>

      <button id="library" class="sidebar-action">
        <span class="icon">▱</span>
        <span>Library</span>
      </button>

      <button id="plugins" class="sidebar-action">
        <span class="icon">⌘</span>
        <span>Plugins</span>
      </button>

      <div class="sidebar-label chat-label">Recent</div>

      <div id="chatHistory"></div>

    </div>

    <div class="account">

      <button id="settings" class="account-button">

        <div class="account-avatar">N</div>

        <div class="account-info">
          <strong>Nova</strong>
          <span>Settings</span>
        </div>

        <span class="account-more">•••</span>

      </button>

    </div>

  </aside>


  <main id="main">

    <header id="topbar">

      <button id="mobileMenu" aria-label="Open menu">
        ☰
      </button>

      <button id="modelSelector" class="model-selector">

        <span class="model-dot"></span>

        <span>Nova</span>

        <span class="model-chevron">⌄</span>

      </button>

      <div class="topbar-spacer"></div>

      <button id="shareButton" class="topbar-button">
        ↗
      </button>

    </header>


    <section id="chat">

      <div id="welcome">

        <div class="hero-mark">
          <span>N</span>
        </div>

        <div class="eyebrow">
          NOVA AI
        </div>

        <h1>
          What are we building today?
        </h1>

        <p>
          Ask anything. Create anything. Explore anything.
        </p>

        <div class="suggestions">

          <button data-prompt="Explain a difficult concept simply">
            <span class="suggestion-icon">✦</span>
            <span>
              <strong>Explain</strong>
              <small>Break down something difficult</small>
            </span>
          </button>

          <button data-prompt="Help me write something">
            <span class="suggestion-icon">Aa</span>
            <span>
              <strong>Write</strong>
              <small>Create or improve something</small>
            </span>
          </button>

          <button data-prompt="Help me build a project">
            <span class="suggestion-icon">&lt;/&gt;</span>
            <span>
              <strong>Build</strong>
              <small>Code and create projects</small>
            </span>
          </button>

          <button data-prompt="Give me some interesting ideas">
            <span class="suggestion-icon">✧</span>
            <span>
              <strong>Explore</strong>
              <small>Discover something new</small>
            </span>
          </button>

        </div>

      </div>

      <div id="messages"></div>

    </section>


    <footer id="composer-area">

      <div id="composer">

        <button id="attach" aria-label="Attach file">
          ＋
        </button>

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message Nova..."
          autocomplete="off"
          spellcheck="true"
        ></textarea>

        <button id="sendButton" aria-label="Send message">
          ↑
        </button>

      </div>

      <div id="composer-hint">
        Nova can make mistakes. Check important information.
      </div>

    </footer>

  </main>

</div>

<script src="js/history.js"></script>
<script src="js/chat.js"></script>
<script src="js/app.js"></script>

</body>
</html>
