<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0b0d12;
color:#f5f5f5;
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
height:100vh;
overflow:hidden
}

.app{
display:flex;
height:100vh
}

.sidebar{
width:250px;
background:#11141b;
border-right:1px solid #242833;
padding:18px;
display:flex;
flex-direction:column
}

.logo{
font-size:21px;
font-weight:700;
margin-bottom:25px
}

.newchat{
border:1px solid #303541;
background:#191d26;
color:white;
border-radius:10px;
padding:12px;
cursor:pointer;
font-size:14px
}

.newchat:hover{
background:#222733
}

.sidebar-bottom{
margin-top:auto;
color:#858b9b;
font-size:13px
}

.main{
flex:1;
display:flex;
flex-direction:column;
min-width:0
}

.topbar{
height:60px;
border-bottom:1px solid #242833;
display:flex;
align-items:center;
padding:0 22px;
font-weight:600
}

.online{
margin-left:10px;
font-size:12px;
color:#7d8597
}

.chat{
flex:1;
overflow-y:auto;
padding:30px 15%;
}

.welcome{
height:100%;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
color:#8b91a1
}

.welcome h1{
color:white;
font-size:34px;
margin:0 0 8px
}

.message{
display:flex;
margin-bottom:26px
}

.user{
justify-content:flex-end
}

.bubble{
max-width:75%;
padding:13px 16px;
border-radius:15px;
line-height:1.6;
white-space:pre-wrap
}

.user .bubble{
background:#252a35
}

.nova .bubble{
background:transparent;
padding-left:0
}

.composer{
padding:15px 15%;
border-top:1px solid #242833
}

.input{
max-width:900px;
margin:auto;
display:flex;
align-items:end;
gap:8px;
background:#181c25;
border:1px solid #303541;
border-radius:15px;
padding:8px
}

textarea{
flex:1;
resize:none;
background:transparent;
border:0;
outline:0;
color:white;
font-size:15px;
padding:10px;
min-height:42px;
max-height:150px
}

.send{
width:42px;
height:42px;
border:0;
border-radius:11px;
background:white;
color:#08090c;
font-size:19px;
cursor:pointer
}

.send:disabled{
opacity:.35
}

@media(max-width:800px){

.sidebar{
display:none
}

.chat{
padding:20px 15px
}

.composer{
padding:12px
}

.bubble{
max-width:88%
}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">Nova</div>

<button class="newchat" onclick="newChat()">
+ New chat
</button>

<div class="sidebar-bottom">
Nova AI<br>
Llama model
</div>

</aside>

<section class="main">

<header class="topbar">
Nova
<span class="online">● online</span>
</header>

<main class="chat" id="chat">

<div class="welcome" id="welcome">
<h1>How can I help?</h1>
<div>Talk to Nova</div>
</div>

</main>

<div class="composer">

<div class="input">

<textarea
id="message"
placeholder="Message Nova..."
rows="1"
></textarea>

<button class="send" id="send" onclick="sendMessage()">↑</button>

</div>

</div>

</section>

</div>

<script>

const input=document.getElementById("message");
const chat=document.getElementById("chat");
const send=document.getElementById("send");
const welcome=document.getElementById("welcome");

input.addEventListener("keydown",e=>{

if(e.key==="Enter"&&!e.shiftKey){

e.preventDefault();
sendMessage();

}

});

async function sendMessage(){

const text=input.value.trim();

if(!text)return;

welcome.style.display="none";

addMessage("user",text);

input.value="";
send.disabled=true;

const thinking=addMessage(
"nova",
"Thinking..."
);

try{

const response=await fetch(
"https://muddy-tooth-d17c.llhomosapient.workers.dev",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text
})
}
);

const data=await response.json();

thinking.remove();

if(data.error){

addMessage("nova","Error: "+data.error);

}else{

addMessage("nova",data.response);

}

}catch(error){

thinking.remove();

addMessage(
"nova",
"Couldn't connect to Nova."
);

}

send.disabled=false;
input.focus();

}

function addMessage(type,text){

const message=document.createElement("div");

message.className="message "+type;

const bubble=document.createElement("div");

bubble.className="bubble";

bubble.textContent=text;

message.appendChild(bubble);

chat.appendChild(message);

chat.scrollTop=chat.scrollHeight;

return message;

}

function newChat(){

chat.innerHTML="";

chat.appendChild(welcome);

welcome.style.display="flex";

input.value="";

input.focus();

}

</script>

</body>
</html>
